
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Presensi QR Code</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #0d1b3d;
}

.container {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 5px 25px #0001;
  text-align: center;
}

h2 { margin-top: 0; }

select, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  font-size: 15px;
  margin-top: 12px;
}

select {
  border: 1px solid #ddd;
}

button {
  border: none;
  background: #008c9e;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#reader {
  width: 100%;
  margin-top: 20px;
}

#hasil {
  padding: 18px;
  margin-top: 20px;
  border-radius: 10px;
  background: #f1f5f9;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.success { color: #16803c; }
.error { color: #d32f2f; }
.info { color: #0d1b3d; }

.small {
  font-size: 12px;
  color: #777;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h2>PRESENSI QR CODE</h2>
<p>Silakan scan QR Code tiket peserta</p>

<select id="kamera">
  <option value="">Pilih kamera</option>
</select>

<button id="mulai" onclick="mulaiScanner()">
  MULAI SCAN
</button>

<div id="reader"></div>

<div id="hasil">
  Menunggu kamera diaktifkan...
</div>

<p class="small">Sistem Presensi Digital</p>

</div>

<script>

// GANTI DENGAN URL WEB APP APPS SCRIPT
const API_URL = 'https://script.google.com/macros/s/AKfycbxBym240mJWvkkW5f2Hq39822OuNpp0daFAwa9182zHTG-Oxtb9bKIvm63mzvTTpo12IA/exec';

let scanner;
let busy = false;
let active = false;

const hasil = document.getElementById('hasil');
const kamera = document.getElementById('kamera');
const tombol = document.getElementById('mulai');

function tampil(pesan, tipe = 'info') {
  hasil.className = tipe;
  hasil.textContent = pesan;
}

async function daftarKamera() {
  try {
    const devices = await Html5Qrcode.getCameras();

    kamera.innerHTML = '';

    devices.forEach((device, i) => {
      const option = document.createElement('option');
      option.value = device.id;
      option.textContent = device.label || 'Kamera ' + (i + 1);
      kamera.appendChild(option);
    });

    if (!devices.length) {
      throw new Error('Tidak ada kamera ditemukan');
    }

    tampil('Kamera ditemukan. Silakan mulai scan.');

  } catch (err) {
    tampil('Tidak dapat mengakses kamera: ' + err, 'error');
  }
}

async function mulaiScanner() {
  if (busy || active) return;

  try {
    busy = true;
    tombol.disabled = true;

    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    const cameraId = kamera.value;

    if (!cameraId) {
      const devices = await Html5Qrcode.getCameras();

      if (!devices.length) {
        throw new Error('Kamera tidak ditemukan');
      }

      camera.innerHTML = '';

      devices.forEach((device, i) => {
        const option = document.createElement('option');
        option.value = device.id;
        option.textContent = device.label || 'Kamera ' + (i + 1);
        kamera.appendChild(option);
      });
    }

    await scanner.start(
      kamera.value,
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      async (decodedText) => {
        if (busy) return;

        busy = true;

        try {
          await scanner.stop();
          active = false;

          await simpanPresensi(decodedText.trim());

        } catch (err) {
          tampil('Gagal membaca kamera: ' + err.message, 'error');
          active = false;
          busy = false;
        }
      }
    );

    active = true;
    tampil('Kamera aktif. Arahkan ke QR Code.');

  } catch (err) {
    tampil('Gagal membuka kamera: ' + err.message, 'error');
    active = false;
  } finally {
    busy = false;
    tombol.disabled = false;
  }
}

function buatRequestId() {
  return 'req_' + Date.now() + '_' +
    Math.random().toString(36).slice(2);
}

// POST untuk menyimpan data
async function simpanPresensi(id) {
  tampil('Memproses tiket: ' + id);

  const requestId = buatRequestId();

  try {
    await fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=UTF-8'
      },
      body: JSON.stringify({
        id: id,
        requestId: requestId
      })
    });

    const status = await cekStatus(requestId);

    if (status === 'SUCCESS') {
      tampil(
        '✓ PRESENSI BERHASIL\n\nID Tiket: ' + id,
        'success'
      );

    } else if (status === 'DUPLICATE') {
      tampil(
        '⚠ TIKET SUDAH DIGUNAKAN\n\nID Tiket: ' + id,
        'error'
      );

    } else {
      throw new Error('Status tidak diketahui: ' + status);
    }

  } catch (err) {
    tampil('Gagal menyimpan: ' + err.message, 'error');

  } finally {
    setTimeout(async () => {
      busy = false;
      await mulaiScanner();
    }, 2500);
  }
}

// JSONP untuk membaca status penyimpanan
function cekStatus(requestId) {
  return new Promise((resolve, reject) => {
    let selesai = false;
    let percobaan = 0;

    const callbackName = 'cb_' +
      Date.now() + '_' +
      Math.random().toString(36).slice(2);

    const script = document.createElement('script');

    const cleanup = () => {
      selesai = true;
      delete window[callbackName];
      script.remove();
    };

    window[callbackName] = (data) => {
      if (data.status === 'PENDING' && percobaan < 15) {
        setTimeout(request, 500);
        return;
      }

      cleanup();

      if (data.status === 'SUCCESS' ||
          data.status === 'DUPLICATE') {
        resolve(data.status);
      } else {
        reject(new Error('Status penyimpanan tidak ditemukan'));
      }
    };

    function request() {
      if (selesai) return;

      percobaan++;

      script.src = API_URL +
        '?requestId=' + encodeURIComponent(requestId) +
        '&callback=' + encodeURIComponent('window.' + callbackName) +
        '&t=' + Date.now();

      script.onerror = () => {
        cleanup();
        reject(new Error('Gagal menghubungi server'));
      };

      document.body.appendChild(script);
    }

    request();

    setTimeout(() => {
      if (!selesai) {
        cleanup();
        reject(new Error('Server tidak merespons'));
      }
    }, 12000);
  });
}

kamera.addEventListener('change', async () => {
  if (active) {
    await scanner.stop();
    active = false;
  }
});

daftarKamera();

</script>

</body>
</html>
